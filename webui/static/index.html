      <symbol id="i-results" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></symbol>
      <symbol id="i-tools" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.3 2.3-2-2 2.3-2.3z"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V2"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></symbol>

      <symbol id="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 17H2.5z"/><path d="M12 9v5"/><path d="M12 17.5v.01"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8v.01"/></symbol>

      <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></symbol>

      <symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></symbol>

      <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9z"/></symbol>

  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/infer" aria-label="DDSP Studio">
        <div class="brand-mark">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h2l2-6 3 12 3-9 2 5h6"/></svg>
        </div>
        <div>
          <div class="brand-title">DDSP Studio</div>
          <div class="brand-sub">barbara 6.3</div>
        </div>
      </a>
      <nav class="nav" id="nav">
        <a class="nav-item" data-route="infer" href="#/infer"><svg><use href="#i-infer"/></svg><span>推理转换</span></a>
        <a class="nav-item" data-route="dataset" href="#/dataset"><svg><use href="#i-data"/></svg><span>数据预处理</span></a>
        <a class="nav-item" data-route="train" href="#/train"><svg><use href="#i-train"/></svg><span>模型训练</span></a>
        <a class="nav-item" data-route="models" href="#/models"><svg><use href="#i-model"/></svg><span>模型管理</span></a>
        <a class="nav-item" data-route="results" href="#/results"><svg><use href="#i-results"/></svg><span>结果库</span></a>
        <a class="nav-item" data-route="tools" href="#/tools"><svg><use href="#i-tools"/></svg><span>工具中心</span></a>
        <a class="nav-item" data-route="settings" href="#/settings"><svg><use href="#i-settings"/></svg><span>设置</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="engine-badge" id="engine-badge"><span class="dot"></span><span id="engine-text">模型未加载</span></div>
        <div class="version" id="version-text">DDSP Studio · 本地离线</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-head">
          <h1 id="page-title">推理转换</h1>
          <p id="page-subtitle">上传干声，选择模型，一键完成歌声转换</p>
        </div>
        <div class="top-actions">
          <div class="status-chip" id="gpu-badge"><span class="dot off"></span><span>检测中…</span></div>
          <div class="active-task hidden" id="active-task"></div>
        </div>
      </header>
      <div class="view" id="view"></div>
    </main>
  </div>

  <div class="global-audio hidden" id="global-audio">
    <button class="btn btn-icon btn-ghost" id="ga-toggle" title="播放 / 暂停"><svg><use href="#i-play"/></svg></button>
    <div class="ga-info">
      <div class="ga-name" id="ga-name">音频</div>
      <div class="ga-time" id="ga-time">0:00 / --:--</div>
    </div>
    <input type="range" class="ga-seek" id="ga-seek" min="0" max="0" step="0.1" value="0">
    <button class="btn btn-icon btn-ghost" id="ga-close" title="停止并关闭"><svg><use href="#i-close"/></svg></button>
  </div>

  <div class="toasts" id="toasts"></div>
  <div id="modal-root"></div>

  <div class="task-drawer hidden" id="task-drawer">
    <div class="drawer-head" id="drawer-head">
      <span class="spinner" id="drawer-spin"></span>
      <span class="d-title" id="drawer-title">任务</span>
      <span class="d-pct" id="drawer-pct"></span>
      <button class="modal-close" id="drawer-close" title="隐藏"><svg width="14" height="14"><use href="#i-close"/></svg></button>
    </div>
    <div class="drawer-body" id="drawer-body">
      <div class="progress"><i id="drawer-bar"></i></div>
      <div class="drawer-log" id="drawer-log"></div>
      <div class="drawer-actions">
        <button class="btn btn-sm" id="drawer-full-log"><svg><use href="#i-log"/></svg>完整日志</button>
        <button class="btn btn-sm btn-danger" id="drawer-cancel"><svg><use href="#i-stop"/></svg>取消任务</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/app.js?v=20261030f"></script>
</body>
</html>
